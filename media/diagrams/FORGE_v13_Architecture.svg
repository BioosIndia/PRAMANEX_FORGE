<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="905" viewBox="0 0 1450 905"><rect width="100%" height="100%" fill="#172738"/><text x="55" y="65" fill="#f2f4f6" font-family="sans-serif" font-size="32" font-weight="bold">FORGE v13 — implementation overview</text><rect x="55" y="110" width="1340" height="96" rx="16" fill="#233d51" stroke="#63cbdf"/><text x="80" y="146" fill="#8ce3f1" font-family="sans-serif" font-size="24">Source / controlled context</text><text x="80" y="179" fill="#e6edf2" font-family="sans-serif" font-size="20">Original bytes, versions, permissions and typed evidence remain authoritative</text><path d="M725 207 v24 m-6-6 6 6 6-6" fill="none" stroke="#8ce3f1" stroke-width="2"/><rect x="55" y="235" width="1340" height="96" rx="16" fill="#233d51" stroke="#63cbdf"/><text x="80" y="271" fill="#8ce3f1" font-family="sans-serif" font-size="24">Domain / bounded candidate work</text><text x="80" y="304" fill="#e6edf2" font-family="sans-serif" font-size="20">Deterministic checks and model candidates preserve exact evidence references</text><path d="M725 332 v24 m-6-6 6 6 6-6" fill="none" stroke="#8ce3f1" stroke-width="2"/><rect x="55" y="360" width="1340" height="96" rx="16" fill="#233d51" stroke="#63cbdf"/><text x="80" y="396" fill="#8ce3f1" font-family="sans-serif" font-size="24">Persistent workflow / review</text><text x="80" y="429" fill="#e6edf2" font-family="sans-serif" font-size="20">Saved revisions and actor/role controls govern the next permitted action</text><path d="M725 457 v24 m-6-6 6 6 6-6" fill="none" stroke="#8ce3f1" stroke-width="2"/><rect x="55" y="485" width="1340" height="96" rx="16" fill="#233d51" stroke="#63cbdf"/><text x="80" y="521" fill="#8ce3f1" font-family="sans-serif" font-size="24">HOLD / human decision</text><text x="80" y="554" fill="#e6edf2" font-family="sans-serif" font-size="20">Missing, conflicting or stale evidence blocks unsupported progression</text><path d="M725 582 v24 m-6-6 6 6 6-6" fill="none" stroke="#8ce3f1" stroke-width="2"/><rect x="55" y="610" width="1340" height="96" rx="16" fill="#233d51" stroke="#63cbdf"/><text x="80" y="646" fill="#8ce3f1" font-family="sans-serif" font-size="24">Evidence / audit / controlled output</text><text x="80" y="679" fill="#e6edf2" font-family="sans-serif" font-size="20">History, current status and release boundary remain independently inspectable</text><text x="55" y="850" fill="#ffca7d" font-family="sans-serif" font-size="20">Engineering diagram drawn from source; not a screenshot or regulatory validation</text></svg>